<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mark | AI Consultant</title>
  <meta name="description" content="Mark is an AI consultant based in Toronto.">
  <style>
    :root {
      --bg: #fafaf7;
      --fg: #1b1b1f;
      --muted: #62626b;
      --accent: #2f5bea;
      --track: #dcdce4;
      --knob: #ffffff;
    }
    :root[data-theme="dark"] {
      --bg: #0f1115;
      --fg: #ececf1;
      --muted: #9a9aa6;
      --accent: #7c9cff;
      --track: #2a2d36;
      --knob: #ececf1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      transition: background .25s, color .25s;
    }
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
    }
    .brand {
      font-weight: 600;
      letter-spacing: .02em;
      color: var(--muted);
    }

    /* Theme toggle: sun on the left, moon on the right */
    .toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border: 1px solid var(--track);
      border-radius: 999px;
      background: transparent;
      color: var(--fg);
      cursor: pointer;
    }
    .toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .toggle svg { width: 18px; height: 18px; opacity: .45; transition: opacity .2s; }
    .toggle .track {
      position: relative;
      width: 38px; height: 20px;
      border-radius: 999px;
      background: var(--track);
    }
    .toggle .knob {
      position: absolute;
      top: 2px; left: 2px;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: var(--knob);
      box-shadow: 0 1px 3px rgba(0,0,0,.3);
      transition: transform .2s;
    }
    :root[data-theme="dark"] .toggle .knob { transform: translateX(18px); }
    :root:not([data-theme="dark"]) .toggle .sun { opacity: 1; }
    :root[data-theme="dark"] .toggle .moon { opacity: 1; }

    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 120px 24px 64px;
    }
    h1 { font-size: clamp(2.4rem, 8vw, 3.6rem); line-height: 1.1; margin: 0 0 8px; }
    .title { font-size: 1.25rem; color: var(--accent); margin: 0 0 4px; font-weight: 600; }
    .location { color: var(--muted); margin: 0 0 32px; }
    p.bio { font-size: 1.1rem; margin: 0 0 32px; }
    a.email {
      display: inline-block;
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
      border-bottom: 2px solid currentColor;
    }
  </style>
</head>
<body>
  <header>
    <button class="toggle" id="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Dark mode">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
      <span class="track"><span class="knob"></span></span>
      <!-- Crescent moon rotated so it faces upwards -->
      <svg class="moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path transform="rotate(45 12 12)" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
      </svg>
    </button>
    <span class="brand">consultant3</span>
  </header>

  <main>
    <h1>Mark</h1>
    <p class="title">AI Consultant</p>
    <p class="location">Toronto, Canada</p>
    <p class="bio">
      I help teams turn AI from a buzzword into working tools. From finding the
      right use cases to building and rolling out practical solutions, I focus on
      clear results, plain language and systems your people will actually use.
    </p>
    <a class="email" href="mailto:your-email@example.com">your-email@example.com</a>
  </main>

  <script>
    (function () {
      var root = document.documentElement;
      var btn = document.getElementById('theme-toggle');
      var saved = null;
      try { saved = localStorage.getItem('theme'); } catch (e) {}
      var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;

      function apply() {
        root.setAttribute('data-theme', dark ? 'dark' : 'light');
        btn.setAttribute('aria-checked', String(dark));
      }
      apply();
      btn.addEventListener('click', function () {
        dark = !dark;
        apply();
        try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
